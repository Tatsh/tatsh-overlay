body:
  - attributes:
      value: |
        This overlay builds on the guru and pentoo overlays, so both must be enabled:

        ```sh
        eselect repository enable guru pentoo tatsh-overlay
        ```

        Before filing, sync all repositories (`emaint sync -a`) and check that the problem still
        happens. Please also search
        [existing issues](https://github.com/Tatsh/tatsh-overlay/issues?q=is%3Aissue).
    type: 'markdown'
  - attributes:
      description: |
        One full atom per line, with version and repository, as passed to `emerge`.
      label: 'Package(s)'
      placeholder: |
        =games-emulation/example-1.2.3::tatsh-overlay
    id: 'packages'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      label: 'Type of problem'
      options:
        - 'Fails to fetch or verify (Manifest, checksum, dead URL)'
        - 'Fails to configure or compile'
        - 'Fails to install or merge (QA error, file collision)'
        - 'Dependency resolution (missing package, blocker, slot conflict)'
        - 'Crashes or misbehaves at runtime'
        - 'Package is outdated'
        - 'Other'
    id: 'kind'
    type: 'dropdown'
    validations:
      required: true
  - attributes:
      description: 'What you did, what you expected, and what happened instead.'
      label: 'What went wrong'
    id: 'summary'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        The first error, with the lines around it. For build failures this is usually just before
        `* ERROR:` in the output. For runtime problems, the error message or backtrace.
      label: 'Error output'
      render: 'text'
    id: 'error'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        For anything that fails during `emerge`, attach the complete `build.log` by dragging the file
        here. Portage prints its path, usually `/var/tmp/portage/<category>/<package>/temp/build.log`.
        Attach or paste any other relevant logs too, such as a program's own log or `dmesg` output.
        Pasted logs go inside the code block below.
      label: 'Build log and other logs'
      value: |
        <details>
        <summary>Logs</summary>

        ```

        ```

        </details>
    id: 'logs'
    type: 'textarea'
  - attributes:
      description: 'Shows the USE flags and dependencies Portage would use now.'
      label: "Output of `emerge -pqv '=<category>/<package>-<version>::tatsh-overlay'`"
      render: 'text'
    id: 'pretend'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        Pass the atom so the output includes the USE flags and compiler flags (`CFLAGS`, `CXXFLAGS`,
        `LDFLAGS`, `MAKEOPTS`) used for that package. Paste it inside the code block below.
      label: "Output of `emerge --info '=<category>/<package>-<version>::tatsh-overlay'`"
      value: |
        <details>
        <summary>emerge --info</summary>

        ```

        ```

        </details>
    id: 'info'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        Output of `git -C "$(portageq get_repo_path / tatsh-overlay)" log -1 --format='%H %cd'`.
      label: 'Overlay revision'
    id: 'revision'
    type: 'input'
    validations:
      required: true
  - attributes:
      description: |
        Any `package.use`, `package.env` or `package.accept_keywords` entries for the package(s), and
        any changes to `CFLAGS`, `LDFLAGS`, the linker or the compiler, such as LTO or Clang.
      label: 'Per-package settings'
      render: 'text'
    id: 'settings'
    type: 'textarea'
  - attributes:
      label: 'Anything else'
    id: 'other'
    type: 'textarea'
  - attributes:
      label: 'Checklist'
      options:
        - label: 'The guru and pentoo overlays are enabled (`eselect repository enable guru pentoo`).'
          required: true
        - label: 'I synced all repositories (`emaint sync -a`) and the problem still happens.'
          required: true
        - label: 'I searched existing issues for this problem.'
          required: true
    id: 'checklist'
    type: 'checkboxes'
description: 'A package in this overlay fails to fetch, build, install or run.'
labels:
  - 'bug'
name: 'Package problem'
title: '<category>/<package>-<version>: '
