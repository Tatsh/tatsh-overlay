body:
  - attributes:
      value: |
        This overlay builds on the guru and pentoo overlays, so both must be enabled and synced. `eselect repository enable` does not sync, so run both commands:

        ```sh
        eselect repository enable guru pentoo tatsh-overlay
        emaint sync -a
        ```

        Before filing, sync all repositories again and check that the problem still happens. Please also search [existing issues](https://github.com/Tatsh/tatsh-overlay/issues?q=is%3Aissue).
    type: 'markdown'
  - attributes:
      description: |
        One full atom per line, with version and repository, as passed to `emerge`.
      label: 'Package(s)'
      placeholder: |
        =games-emulation/example-1.2.3::tatsh-overlay
    id: 'packages'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      label: 'Type of problem'
      options:
        - 'Fails to fetch or verify (Manifest, checksum, dead URL)'
        - 'Fails to configure or compile'
        - 'Fails to install or merge (QA error, file collision)'
        - 'Dependency resolution (missing package, blocker, slot conflict)'
        - 'Crashes or misbehaves at runtime'
        - 'Other'
    id: 'kind'
    type: 'dropdown'
    validations:
      required: true
  - attributes:
      description: 'What you did, what you expected, and what happened instead.'
      label: 'What went wrong'
    id: 'summary'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        The first error, with the lines around it. For build failures this is usually just before `* ERROR:` in the output. For runtime problems, the error message or backtrace.
      label: 'Error output'
      render: 'text'
    id: 'error'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        For anything that fails during `emerge`, attach the complete `build.log` by dragging the file here. Portage prints its path, usually `/var/tmp/portage/<category>/<package>/temp/build.log`. Attach or paste any other relevant logs too, such as a program's own log or `dmesg` output. Pasted logs go inside the code block below. Check logs for personal information, such as usernames, home directories and hostnames, before submitting.
      label: 'Build log and other logs'
      value: |
        <details>
        <summary>Logs</summary>

        ```

        ```

        </details>
    id: 'logs'
    type: 'textarea'
  - attributes:
      description: |
        This shows the global `USE` and compiler flags (`CFLAGS`, `CXXFLAGS`, `LDFLAGS`, `MAKEOPTS`). For a package that is already installed, passing the atom also shows the flags it was built with. Paste it inside the code block below.

        **Before submitting, check the output for personal information and remove or replace it**, for example your hostname (often part of the kernel version on the `System uname` line), names of private machines or paths, and usernames or tokens in `sync-uri`, `GENTOO_MIRRORS` or `PORTAGE_BINHOST` URLs.
      label: "Output of `emerge --info '=<category>/<package>-<version>::tatsh-overlay'`"
      value: |
        <details>
        <summary>emerge --info</summary>

        ```

        ```

        </details>
    id: 'info'
    type: 'textarea'
    validations:
      required: true
  - attributes:
      description: |
        `emerge --info` does not show a package's own settings until it is installed, so for a package that fails to build, list its `package.use`, `package.env` and `package.accept_keywords` entries here, and any changes to the compiler or linker such as LTO or Clang. These commands find the entries and the `package.env` files they use:

        ```sh
        grep -rn '<category>/<package>' /etc/portage
        grep -rhE '^[<>=~]*<category>/<package>([-[:space:]]|$)' /etc/portage/package.env | sed 's/#.*//' | awk '{for (i = 2; i <= NF; i++) print "/etc/portage/env/" $i}' | xargs -r grep -H .
        ```
      label: 'Per-package settings'
      render: 'text'
    id: 'settings'
    type: 'textarea'
  - attributes:
      label: 'Anything else'
    id: 'other'
    type: 'textarea'
  - attributes:
      label: 'Checklist'
      options:
        - label: 'The guru and pentoo overlays are enabled (`eselect repository enable guru pentoo`).'
          required: true
        - label: 'I synced all repositories (`emaint sync -a`) and the problem still happens.'
          required: true
        - label: 'I searched existing issues for this problem.'
          required: true
    id: 'checklist'
    type: 'checkboxes'
description: 'A package in this overlay fails to fetch, build, install or run.'
labels:
  - 'bug'
name: 'Package problem'
title: '<category>/<package>-<version>: '
